
name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run unit tests
        working-directory: docker-demo
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build Docker image
        run: docker build -t python-docker-demo:${{ github.sha }} ./docker-demo

      - name: Start Docker container
        run: docker run -d --name python-docker-demo -p 127.0.0.1:8080:8000 python-docker-demo:${{ github.sha }}

      - name: Test running container
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              break
            fi

            if [ "$attempt" -eq 10 ]; then
              docker logs python-docker-demo
              exit 1
            fi

            sleep 1
          done

          test "$(curl -fsS http://127.0.0.1:8080/health)" = "OK"
          test "$(curl -fsS http://127.0.0.1:8080/)" = "Hello from Docker + GitHub Actions!"

          echo "Docker container test passed!"

      - name: Stop container
        if: always()
        run: docker rm -f python-docker-demo || true
 
  publish:
    name: Publish Docker Image to GHCR
    needs: docker-ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/python-docker-demo"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./docker-demo
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:latest
       
