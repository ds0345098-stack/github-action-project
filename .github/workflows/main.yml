
name: Job Artifacts Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create a report
        run: |
          mkdir -p reports
          echo "Build completed successfully!" > reports/report.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: reports/report.txt
