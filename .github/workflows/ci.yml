name: Environment Secret Demo

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-job:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read environment secret
        env:
          DEPLOY_MESSAGE: ${{ secrets.DEPLOY_MESSAGE }}
        run: |
          echo "Production environment is selected."
          if [ -n "$DEPLOY_MESSAGE" ]; then
            echo "Environment secret is configured: yes"
          else
            echo "Environment secret is configured: no"
          fi
