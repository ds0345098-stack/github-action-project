name: Permission Scope Demo

on:
  push:

permissions:
  contents: read

jobs:
  read-job:
    runs-on: ubuntu-latest
    steps:
      - name: Read repository
        uses: actions/checkout@v4

      - name: Show read job
        run: echo "Read job succeeded"

  check-repo-details:
    runs-on: ubuntu-latest
    permissions:
       contents: read
       issues: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: get repository details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
         count=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=bug" \
          --jq '[.[] | select(.pull_request == null)] | length')
         echo "Number of open issues: $count"
            if [ "$count" -eq 0 ]; then
              gh api \
                
                 --method POST \
                 "repos/${{ github.repository }}/issues" \
                -f title="automated bug report" \
                -f body="created by github action because there is no open bug report" \
                -f 'labels[]=bug'
            else
              echo "An open bug report already exists."
            fi