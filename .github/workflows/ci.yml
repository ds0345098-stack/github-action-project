name: Read demo secret
on:
 push:
  branches:
    - main
permissions:
  contents: read
          
jobs:
   read-job:
       runs-on: ubuntu-latest
       steps: 
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Read demo secret
            env:
              DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
            run: |
              echo "The secret was passed to this step."
              echo "Secret is configured: $([ -n "$DEMO_SECRET" ] && echo "yes" || echo "no")"