name: Permission Scope Demo

on:
  push:

permissions:
  contents: read

jobs:
  read-job:
    runs-on: ubuntu-latest
    steps:
      - name: Read repository
        uses: actions/checkout@v4

      - name: Show read job
        run: echo "Read job succeeded"

  issue-job:
    runs-on: ubuntu-latest
    needs: read-job

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Job-level permission test" \
            --body "This issue tests job-level permissions."
  deploy:
    runs-on: ubuntu-latest
    needs: issue-job

    permissions:
      contents: read
      issues: write
      deployments: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create a deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments \
            -f ref=main \
            -f environment=production \
            -f description="Job-level permission test deployment"   
           