name: Permission Scope Demo

on:
  push:

permissions:
  contents: read

jobs:
  read-job:
    runs-on: ubuntu-latest
    steps:
      - name: Read repository
        uses: actions/checkout@v4

      - name: Show read job
        run: echo "Read job succeeded"

  check-repo-details:
    runs-on: ubuntu-latest
    permissions:
       contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: get repository details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
         count=$(gh api "repos/${{ github.repository }}/issues?state=open" \
          --jq '[.[] | select(pull_request == null)] | length')
         echo "Number of open issues: $count"
            if [ $count -gt 0 ]; then
              echo "There are open issues in the repository."
            else
              echo "No open issues found."
            fi