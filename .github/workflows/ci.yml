name: Permission Scope Demo

on:
  push:

permissions:
  contents: read

jobs:
  read-job:
    runs-on: ubuntu-latest
    steps:
      - name: Read repository
        uses: actions/checkout@v4

      - name: Show read job
        run: echo "Read job succeeded"

  issue-job:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Create an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Job-level permission test" \
            --body "This issue tests job-level permissions."