name: GITHUB_TOKEN Permissions Demo

on:
  push:

permissions:
  contents: read
  issues: write

jobs:
  permission-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Create an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Issue created by GitHub Actions" \
            --body "This issue was created by GITHUB_TOKEN."