name: demo outputs
on:
  push:

jobs:
  get_info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - id: get_version
        run: echo "version=1.2.3" >> "$GITHUB_OUTPUT"

  print_info:
    runs-on: ubuntu-latest
    needs: get_info
    steps:
      - name: Print version
        run: echo "Version from previous job:${{ needs.get_info.outputs.version }}"      
    
